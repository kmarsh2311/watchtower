name: Watchtower
description: Safely inventories Stash scene files and reports filesystem differences.
version: 1.0.16
ui:
  javascript:
    - librarymanager.js
  css:
    - librarymanager.css
  assets:
    /: assets
settings:
  onboardingCompleted:
    displayName: Onboarding Completed
    description: Indicates whether initial onboarding setup has been completed.
    type: BOOLEAN
  testSceneId:
    displayName: Test Scene ID
    description: Optional test scene ID. While set, Automatic Renaming is restricted to this scene only, protecting the rest of your library while you test.
    type: STRING
  automaticRenaming:
    displayName: Automatic Renaming
    description: Rename an edited scene from its stable base, studio and performers. Test Scene ID restricts this to one scene while testing.
    type: BOOLEAN
  contactSheetScope:
    displayName: Contact Sheet Location Scope
    description: Choose whether contact sheets are generated across all library folders or restricted to your incoming folder.
    type: STRING
  cleanPerformerOnlyTitles:
    displayName: Deduplicate Performer-Only Titles
    description: When the Stash title consists only of performer names, omit the duplicate title component from the filename.
    type: BOOLEAN
  stripStudioFromTitle:
    displayName: Strip Studio from Titles
    description: Automatically remove embedded studio names from the Stash title before generating filenames.
    type: BOOLEAN
  stripPerformersFromTitle:
    displayName: Strip Performers from Titles
    description: Automatically remove embedded performer names from the Stash title before generating filenames.
    type: BOOLEAN
  stripConnectiveWords:
    displayName: Strip Connective Words & Punctuation
    description: Clean leftover linking words (and, &, with, feat., vs.) and trailing symbols left behind after metadata stripping.
    type: BOOLEAN
  includeStudio:
    displayName: Include Studio in Filename
    description: Include the scene's studio name when generating filenames.
    type: BOOLEAN
  includePerformers:
    displayName: Include Performers in Filename
    description: Include tagged performer names when generating filenames.
    type: BOOLEAN
  includeSceneDate:
    displayName: Include Scene Date in Filename
    description: Include the Stash scene date in filenames using the fixed, sortable YYYY-MM-DD format.
    type: BOOLEAN
  filenameDatePosition:
    displayName: Scene Date Position
    description: Place the optional YYYY-MM-DD scene date at the beginning or end of the filename.
    type: STRING
  includeVideoQuality:
    displayName: Include Video Quality
    description: Add video resolution tags such as [1080p] or [2160p] to filenames when available.
    type: BOOLEAN
  filenameQualityPosition:
    displayName: Video Quality Position
    description: Place the optional resolution tag at the beginning or end of the filename.
    type: STRING
  maxPerformersInFilename:
    displayName: Maximum Performers in Filename
    description: Limit the number of performers included in filenames (e.g. first 2). Set to 0 for all.
    type: NUMBER
  collapseMultipleDashes:
    displayName: Collapse Multiple Separators & Spaces
    description: Clean duplicate dashes and spaces created during title formatting.
    type: BOOLEAN
  renameSettleSeconds:
    displayName: Rename & Contact Sheet Settle Delay
    description: Seconds to wait after a metadata edit before renaming the video and refreshing its contact sheet.
    type: NUMBER
  masterTitleSource:
    displayName: Master Title & Base Source
    description: Choose whether the scene title in filenames is driven by Stash's scraped metadata or the original physical filename on disk.
    type: STRING
  filenameOrder:
    displayName: Filename Information Order
    description: Choose whether the title, studio or performers appear first. This affects future renames only.
    type: STRING
  filenameSectionSeparator:
    displayName: Between Title, Studio and Performers
    description: Friendly choice used between the main parts of a filename, such as Dash or Space.
    type: STRING
  filenamePerformerSeparator:
    displayName: Between Performer Names
    description: Friendly choice used when a scene has more than one performer, such as Comma or Space.
    type: STRING
  macNotifications:
    displayName: Desktop Notifications
    description: Show important Watchtower warnings and failures as native desktop notifications on Windows, macOS, or Linux. Enabled by default.
    type: BOOLEAN
  notifySuccessfulRenames:
    displayName: Notify Successful Renames
    description: Also show a desktop notification after a successful automatic rename. Requires Desktop Notifications. Enabled by default.
    type: BOOLEAN
  autoStartMonitor:
    displayName: Automatically Start Filesystem Monitor
    description: Ensure monitoring is running when the Stash web interface loads. Recommended.
    type: BOOLEAN
  startAtLogin:
    displayName: Start Monitoring at Login
    description: Start the background watcher when you sign in on macOS, Windows or Linux, and retry once a minute until Stash is available.
    type: BOOLEAN
  automaticMoveReconciliation:
    displayName: Reconcile Verified External Moves
    description: After an exact watched move passes size/hash checks, ask Stash to scan the destination and verify its path update.
    type: BOOLEAN
  transcoderReplacementCompatibility:
    displayName: Transcoder Replacement Compatibility
    description: Opt in to reconnect likely same-folder transcoder replacements (for example movie.mp4 to movie encoded.mp4) even though their size/hash changed. Ambiguous replacements are never accepted.
    type: BOOLEAN
  automaticIncomingScan:
    displayName: Automatically Add Completed Videos
    description: Watch your chosen incoming folders and ask Stash to add each new video after it has completely finished downloading.
    type: BOOLEAN
  incomingFolder:
    displayName: Incoming Folders
    description: Up to five folders inside your Stash libraries where new downloads arrive before you organise them.
    type: STRING
  incomingSettleMinutes:
    displayName: Wait Before Adding a Video
    description: "Minutes that a video must remain completely unchanged before Library Manager asks Stash to add it (default: 5). If 0 or blank, the 5-minute default is used."
    type: NUMBER
  autoFilingEnabled:
    displayName: Enable Automatic Filing Proposals
    description: Propose destination folders for newly arrived videos in incoming folders based on performer, studio, or verified tag matching. Disabled by default.
    type: BOOLEAN
  autoFilingOrganizeBy:
    displayName: Automatic Filing Organization
    description: "Choose whether to organize new incoming videos by performer, studio, or combined Performer, Studio or Tag review mode. Combined review is the default."
    type: STRING
  autoFilingDestinationRoots:
    displayName: Automatic Filing Destination Roots
    description: Up to five destination root directories containing your existing performer, studio, or category folders.
    type: STRING
  autoFilingDestinationRootsOverride:
    displayName: Limit Automatic Filing to Selected Roots
    description: Use manually selected destination roots instead of all Stash library roots.
    type: BOOLEAN
  autoFilingDestinationRoot:
    displayName: Automatic Filing Destination Root
    description: Legacy single root directory containing your existing performer or studio folders (e.g. /Media/Performers).
    type: STRING
  autoFilingMatchSource:
    displayName: Automatic Filing Match Source
    description: Choose whether to prioritize Stash scene metadata (if available) or match purely from the physical filename.
    type: STRING
  autoFilingTrigger:
    displayName: When to Suggest Filing
    description: "Choose when Watchtower suggests filing: 'import' (immediately after video import) or 'metadata' (after a performer, studio, or tag is assigned in Stash)."
    type: STRING
  autoFilingMaxDiscoveryDepth:
    displayName: Maximum Folder Discovery Depth
    description: "Maximum folder depth (1 to 8, default: 4) when automatically searching destination roots for matching performer, studio, or category folders."
    type: NUMBER
  generateContactSheets:
    displayName: Generate Visual Contact Sheets (CSM)
    description: Automatically generate a visual contact sheet companion image for new videos within your configured location scope.
    type: BOOLEAN
  refreshContactSheetsOnRename:
    displayName: Refresh Contact Sheets on Metadata Edits
    description: Re-render contact sheets with updated title/performer banners when scene metadata is edited in Stash. If disabled, existing contact sheets are kept and safely renamed with the video.
    type: BOOLEAN
  contactSheetGrid:
    displayName: Contact Sheet Layout
    description: Grid layout for generated contact sheets, such as 5x4 (20 frames widescreen) or 4x4 (16 frames).
    type: STRING
  contactSheetBanner:
    displayName: Include Header Banner
    description: Include a top metadata header banner showing resolution, size, duration, and filename on contact sheets.
    type: BOOLEAN
  contactSheetAdjustVertical:
    displayName: Auto-adjust for Vertical Videos
    description: Automatically adjust the grid layout for vertical (9:16) videos so contact sheets fit standard widescreen monitors.
    type: BOOLEAN
  contactSheetScript:
    displayName: Custom Contact Sheet Script
    description: Optional path to a trusted local executable. It runs with the same access as Stash. Leave blank to use the built-in generator.
    type: STRING
  allowCustomContactSheetScript:
    displayName: Allow Trusted Custom Script
    description: Explicitly permit the configured custom contact-sheet executable to run. Enable only for code you trust.
    type: BOOLEAN
exec:
  - python
  - "{pluginDir}/librarymanager.py"
interface: raw
tasks:
  - name: Generate Missing Contact Sheets for Incoming Folder
    description: Generate contact sheet companion images for videos in your incoming folder that are currently missing artwork.
    defaultArgs:
      mode: generate_incoming_contact_sheets
  - name: Build Read-Only Inventory
    description: Record Stash scene files in SQLite and report missing or changed paths. No files or Stash records are changed.
    defaultArgs:
      mode: inventory
  - name: Find Renamed Files (Read Only)
    description: Search each missing file's original folder for safe rename candidates and write a report. No changes are made.
    defaultArgs:
      mode: reconcile
  - name: Build Resolution Plan (Read Only)
    description: Compare stale and live scene metadata for confirmed conflicts and recommend a safe resolution. No changes are made.
    defaultArgs:
      mode: plan
  - name: Preview Metadata Merge (Read Only)
    description: Show exactly what missing metadata could be copied from stale scenes to live scenes. No changes are made.
    defaultArgs:
      mode: preview_merge
  - name: Preview Safe Filenames (Read Only)
    description: Establish stable filename bases and preview title, studio and performer filenames. No files are renamed.
    defaultArgs:
      mode: preview_filenames
  - name: Preview Configured Test Rename
    description: Preview the filename for Test Scene ID. No changes are made.
    defaultArgs:
      mode: preview_test_rename
  - name: Apply Configured Test Rename
    description: Rename only the configured Test Scene ID after confirmation. Uses Stash's native file operation.
    defaultArgs:
      mode: apply_test_rename
  - name: Process Filing Queue
    description: Internal serialized worker that executes approved filing transfers in the background.
    defaultArgs:
      mode: process_filing_queue
  - name: Process Rename Queue
    description: Internal serialized worker for queued automatic renames.
    defaultArgs:
      mode: process_rename_queue
  - name: Start Read-Only Filesystem Monitor
    description: Start background monitoring. Depending on your settings, Watchtower can record changes, reconnect verified moves, add completed downloads and generate contact sheets.
    defaultArgs:
      mode: start_monitor
  - name: Stop Filesystem Monitor
    description: Ask the background filesystem monitor to stop safely.
    defaultArgs:
      mode: stop_monitor
  - name: Filesystem Monitor Status
    description: Report whether the read-only filesystem monitor is running and show event totals.
    defaultArgs:
      mode: monitor_status
  - name: Reconcile Filesystem Events (Read Only)
    description: Match recorded filesystem events to Stash file records and write a proposal report. No Stash or file changes are made.
    defaultArgs:
      mode: reconcile_events
  - name: View / Export Recent Activity
    description: Summarise recent Library Manager activity and export readable JSON and CSV reports. No changes are made.
    defaultArgs:
      mode: activity
hooks:
  - name: Rename Edited Scene
    description: Handles scene, performer, and studio metadata updates when Automatic Renaming is explicitly enabled.
    triggeredBy:
      - Scene.Update.Post
      - Performer.Update.Post
      - Studio.Update.Post

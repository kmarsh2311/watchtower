name: Tests

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r requirements.txt
      - name: Verify bundled watchdog in isolated Python
        run: python -m unittest tests.test_bundled_watchdog
      - name: Run full Python test suite
        run: python -m pytest -vv --full-trace tests/
      - name: Run complete UI test suite
        if: always()
        run: node tests/test_ui.mjs

name: Bundled watchdog

on:
  workflow_dispatch:

jobs:
  filesystem-smoke-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Verify bundled watchdog in isolated Python
        run: python -m unittest tests.test_bundled_watchdog

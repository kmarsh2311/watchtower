name: Update transcoder help text

on:
  push:
    branches:
      - fix/companion-safety-v1.0.4
    paths:
      - .github/workflows/update-transcoder-help-text.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/companion-safety-v1.0.4
          fetch-depth: 0
      - name: Update help text
        shell: python
        run: |
          from pathlib import Path
          p = Path('librarymanager.js')
          text = p.read_text()
          old = 'Optional compatibility for FileFlows, HandBrake, Tdarr and similar tools. Allows a strongly related same-folder replacement such as movie.mp4 → movie encoded.mp4 to reconnect even though its video fingerprint changed. Ambiguous matches are skipped.'
          new = 'Optional compatibility for FileFlows, HandBrake, Tdarr and similar tools. Allows Watchtower to reconnect a newly encoded replacement, such as movie.mp4 → movie encoded.mp4, to the existing Stash scene. Only strong same-folder matches are accepted; ambiguous matches are left for review.'
          if old not in text:
              raise SystemExit('Existing help text not found')
          p.write_text(text.replace(old, new, 1))
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add librarymanager.js
          git commit -m "Clarify transcoder compatibility help text"
          git push origin HEAD:fix/companion-safety-v1.0.4

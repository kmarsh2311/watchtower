name: Add created-first transcoder replacement support

on:
  push:
    branches:
      - fix/companion-safety-v1.0.4
    paths:
      - .github/workflows/add-created-first-transcoder-replacement.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/companion-safety-v1.0.4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('librarymanager_monitor.py')
          text = p.read_text()

          old = '''        self._recent_creates: dict[str, float] = {}\n        self._recent_deleted_videos: dict[str, float] = {}\n        self._recent_creates_lock = threading.Lock()\n'''
          new = '''        self._recent_creates: dict[str, float] = {}\n        self._recent_deleted_videos: dict[str, float] = {}\n        # Recently created/modified videos are retained longer so a transcoder can\n        # finish its output before the user deletes the original source file.\n        self._recent_video_candidates: dict[str, float] = {}\n        self._recent_creates_lock = threading.Lock()\n'''
          if old not in text:
              raise SystemExit('handler state pattern not found')
          text = text.replace(old, new, 1)

          old = '''            with self._recent_creates_lock:\n                self._recent_creates[event.src_path] = time.monotonic()\n                # Prune entries older than 30 s to prevent unbounded growth\n                cutoff = time.monotonic() - 30.0\n                self._recent_creates = {k: v for k, v in self._recent_creates.items() if v > cutoff}\n                self._recent_deleted_videos = {k: v for k, v in self._recent_deleted_videos.items() if v > cutoff}\n                deleted_candidates = [old for old, seen in self._recent_deleted_videos.items()\n                                      if time.monotonic() - seen <= 30.0\n                                      and likely_transcoder_replacement(old, event.src_path)]\n'''
          new = '''            with self._recent_creates_lock:\n                now = time.monotonic()\n                self._recent_creates[event.src_path] = now\n                if Path(event.src_path).suffix.lower() in VIDEO_EXTENSIONS:\n                    self._recent_video_candidates[event.src_path] = now\n                # Short-lived create/delete tracking remains at 30 seconds.\n                cutoff = now - 30.0\n                self._recent_creates = {k: v for k, v in self._recent_creates.items() if v > cutoff}\n                self._recent_deleted_videos = {k: v for k, v in self._recent_deleted_videos.items() if v > cutoff}\n                # Transcodes can take a long time; retain only recently active outputs\n                # for ten minutes after their last create/modify event.\n                video_cutoff = now - 600.0\n                self._recent_video_candidates = {k: v for k, v in self._recent_video_candidates.items()\n                                                 if v > video_cutoff}\n                deleted_candidates = [old for old, seen in self._recent_deleted_videos.items()\n                                      if now - seen <= 30.0\n                                      and likely_transcoder_replacement(old, event.src_path)]\n'''
          if old not in text:
              raise SystemExit('created tracking pattern not found')
          text = text.replace(old, new, 1)

          old = '''            if Path(event.src_path).suffix.lower() not in TEMPORARY_DOWNLOAD_EXTENSIONS:\n                if Path(event.src_path).suffix.lower() in VIDEO_EXTENSIONS:\n                    with self._recent_creates_lock:\n                        self._recent_deleted_videos[event.src_path] = time.monotonic()\n                record_filesystem_event(self.database_path, "deleted", event.src_path, is_directory=event.is_directory, initial_status="pending")\n'''
          new = '''            if Path(event.src_path).suffix.lower() not in TEMPORARY_DOWNLOAD_EXTENSIONS:\n                replacement_candidate = None\n                if Path(event.src_path).suffix.lower() in VIDEO_EXTENSIONS:\n                    with self._recent_creates_lock:\n                        now = time.monotonic()\n                        self._recent_deleted_videos[event.src_path] = now\n                        video_cutoff = now - 600.0\n                        self._recent_video_candidates = {k: v for k, v in self._recent_video_candidates.items()\n                                                         if v > video_cutoff}\n                        created_candidates = [new_path for new_path, seen in self._recent_video_candidates.items()\n                                              if new_path != event.src_path\n                                              and now - seen <= 600.0\n                                              and Path(new_path).is_file()\n                                              and likely_transcoder_replacement(event.src_path, new_path)]\n                    if (getattr(self.worker, "transcoder_compatibility", False) is True\n                            and len(created_candidates) == 1):\n                        replacement_candidate = created_candidates[0]\n                record_filesystem_event(self.database_path, "deleted", event.src_path, is_directory=event.is_directory, initial_status="pending")\n                if replacement_candidate:\n                    self.worker.submit(event.src_path, replacement_candidate)\n'''
          if old not in text:
              raise SystemExit('deleted tracking pattern not found')
          text = text.replace(old, new, 1)

          old = '''    def on_modified(self, event):\n        # Modification events are useful only for the incoming stability timer. They do not\n        # identify a move/deletion and must not create an unexplained review warning.\n        if not event.is_directory and self._relevant(event.src_path, False):\n            if self.incoming_worker:\n                self.incoming_worker.submit(event.src_path)\n'''
          new = '''    def on_modified(self, event):\n        # Modification events are useful only for the incoming stability timer. They do not\n        # identify a move/deletion and must not create an unexplained review warning.\n        if not event.is_directory and self._relevant(event.src_path, False):\n            if (getattr(self.worker, "transcoder_compatibility", False) is True\n                    and Path(event.src_path).suffix.lower() in VIDEO_EXTENSIONS):\n                with self._recent_creates_lock:\n                    now = time.monotonic()\n                    self._recent_video_candidates[event.src_path] = now\n                    cutoff = now - 600.0\n                    self._recent_video_candidates = {k: v for k, v in self._recent_video_candidates.items()\n                                                     if v > cutoff}\n            if self.incoming_worker:\n                self.incoming_worker.submit(event.src_path)\n'''
          if old not in text:
              raise SystemExit('modified pattern not found')
          text = text.replace(old, new, 1)

          old = '''                    resolve_filesystem_event(self.database_path, "moved", source, destination)\n                    notify(self.notifications, f"Stash updated: {Path(destination).name}")\n'''
          new = '''                    if transcode_replacement:\n                        # A transcoder may report replacement as delete+create rather than a\n                        # filesystem move. Clear both review events after Stash confirms it.\n                        resolve_filesystem_event(self.database_path, "deleted", source)\n                        resolve_filesystem_event(self.database_path, "created", destination)\n                    else:\n                        resolve_filesystem_event(self.database_path, "moved", source, destination)\n                    notify(self.notifications, f"Stash updated: {Path(destination).name}")\n'''
          if old not in text:
              raise SystemExit('resolve event pattern not found')
          text = text.replace(old, new, 1)
          p.write_text(text)

          t = Path('tests/test_transcoder_replacement.py')
          tests = t.read_text()
          tests += r'''


def test_created_output_then_deleted_original_is_submitted_when_opted_in():
    with tempfile.TemporaryDirectory() as td:
        root = Path(td)
        db = root / 'db.sqlite3'
        old = root / 'movie.mp4'
        new = root / 'movie encoded.mp4'
        old.write_bytes(b'old source')
        _insert(db, old)
        new.write_bytes(b'new encoded output')
        worker = MagicMock()
        worker.transcoder_compatibility = True
        handler = LibraryEventHandler(db, worker, False, incoming_worker=None)
        created = MagicMock(is_directory=False, src_path=str(new))
        handler.on_created(created)
        worker.reset_mock()
        old.unlink()
        deleted = MagicMock(is_directory=False, src_path=str(old))
        with patch('librarymanager_monitor.threading.Timer'):
            handler.on_deleted(deleted)
        worker.submit.assert_called_once_with(str(old), str(new))


def test_created_output_then_deleted_original_is_not_submitted_when_disabled():
    with tempfile.TemporaryDirectory() as td:
        root = Path(td)
        db = root / 'db.sqlite3'
        old = root / 'movie.mp4'
        new = root / 'movie encoded.mp4'
        old.write_bytes(b'old source')
        _insert(db, old)
        new.write_bytes(b'new encoded output')
        worker = MagicMock()
        worker.transcoder_compatibility = False
        handler = LibraryEventHandler(db, worker, False, incoming_worker=None)
        handler.on_created(MagicMock(is_directory=False, src_path=str(new)))
        worker.reset_mock()
        old.unlink()
        with patch('librarymanager_monitor.threading.Timer'):
            handler.on_deleted(MagicMock(is_directory=False, src_path=str(old)))
        worker.submit.assert_not_called()


def test_recent_modified_encoded_output_counts_as_replacement_candidate():
    with tempfile.TemporaryDirectory() as td:
        root = Path(td)
        db = root / 'db.sqlite3'
        old = root / 'movie.mp4'
        new = root / 'movie encoded.mp4'
        old.write_bytes(b'old source')
        _insert(db, old)
        new.write_bytes(b'partial encode')
        worker = MagicMock()
        worker.transcoder_compatibility = True
        handler = LibraryEventHandler(db, worker, False, incoming_worker=None)
        handler.on_created(MagicMock(is_directory=False, src_path=str(new)))
        handler._recent_video_candidates[str(new)] = time.monotonic() - 590
        handler.on_modified(MagicMock(is_directory=False, src_path=str(new)))
        worker.reset_mock()
        old.unlink()
        with patch('librarymanager_monitor.threading.Timer'):
            handler.on_deleted(MagicMock(is_directory=False, src_path=str(old)))
        worker.submit.assert_called_once_with(str(old), str(new))


def test_created_first_ambiguous_replacements_are_not_auto_paired():
    with tempfile.TemporaryDirectory() as td:
        root = Path(td)
        db = root / 'db.sqlite3'
        old = root / 'movie.mp4'
        a = root / 'movie encoded.mp4'
        b = root / 'movie-hevc.mkv'
        old.write_bytes(b'old source')
        _insert(db, old)
        a.write_bytes(b'a')
        b.write_bytes(b'b')
        worker = MagicMock()
        worker.transcoder_compatibility = True
        handler = LibraryEventHandler(db, worker, False, incoming_worker=None)
        handler.on_created(MagicMock(is_directory=False, src_path=str(a)))
        handler.on_created(MagicMock(is_directory=False, src_path=str(b)))
        worker.reset_mock()
        old.unlink()
        with patch('librarymanager_monitor.threading.Timer'):
            handler.on_deleted(MagicMock(is_directory=False, src_path=str(old)))
        worker.submit.assert_not_called()
'''
          t.write_text(tests)
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m py_compile librarymanager.py librarymanager_monitor.py librarymanager_core.py
      - name: Focused regression tests
        run: python -m pytest -q tests/test_transcoder_replacement.py tests/test_fileflows_compatibility.py tests/test_companion_safety.py tests/test_external_manual_rename.py
      - name: Full test suite
        run: python -m pytest -q
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add librarymanager_monitor.py tests/test_transcoder_replacement.py
          git commit -m "Handle encoded output created before source deletion"
          git push origin HEAD:fix/companion-safety-v1.0.4

name: Apply external manual rename preservation fix

on:
  push:
    branches:
      - fix/companion-safety-v1.0.4
    paths:
      - .github/workflows/fix-external-manual-rename.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/companion-safety-v1.0.4
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch automatic rename hook gating
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('librarymanager.py')
          text = path.read_text(encoding='utf-8')

          marker = '''def automatic_scene_allowed(config, scene_id):
              """A configured test scene acts as a hard scope lock for automatic hooks."""
              test_scene_id = str((config or {}).get("testSceneId") or "").strip()
              return not test_scene_id or test_scene_id == str(scene_id)
          '''
          marker = marker.replace('          ', '')
          replacement = marker + '''\n\nSCENE_NAMING_HOOK_FIELDS = frozenset({"title", "studio_id", "performer_ids", "code", "date"})\n\n\ndef scene_hook_has_naming_changes(changed):\n    """Only explicit naming-metadata edits may trigger an automatic filename change.\n\n    Filesystem reconciliation can cause Stash to emit Scene.Update.Post hooks with an\n    empty input payload. Treating those as metadata edits would undo a user's manual\n    external filename change immediately after Watchtower reconciles it.\n    """\n    if not isinstance(changed, dict) or not changed:\n        return False\n    return bool(SCENE_NAMING_HOOK_FIELDS.intersection(changed))\n'''

          if 'def scene_hook_has_naming_changes(changed):' not in text:
              if marker not in text:
                  raise SystemExit('Could not find automatic_scene_allowed marker')
              text = text.replace(marker, replacement, 1)

          old = '''        else:\n            relevant = bool({"title", "studio_id", "performer_ids", "code", "date"} & set(changed)) if changed else True\n            if not relevant:\n                print(json.dumps({"output": "Scene update has no relevant naming metadata changes; skipping."}))\n                return\n            if entity_id:\n                target_scene_ids = [str(entity_id)]\n'''
          new = '''        else:\n            relevant = scene_hook_has_naming_changes(changed)\n            if not relevant:\n                detail = (\n                    "Scene update has no explicit naming metadata changes; skipping."\n                    if not changed\n                    else "Scene update has no relevant naming metadata changes; skipping."\n                )\n                print(json.dumps({"output": detail}))\n                return\n            if entity_id:\n                target_scene_ids = [str(entity_id)]\n'''

          if old not in text:
              if new not in text:
                  raise SystemExit('Could not find Scene.Update hook block')
          else:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_external_manual_rename.py')
          test_path.write_text('''from librarymanager import scene_hook_has_naming_changes\n\n\ndef test_empty_scene_update_does_not_trigger_automatic_rename():\n    assert scene_hook_has_naming_changes({}) is False\n    assert scene_hook_has_naming_changes(None) is False\n\n\ndef test_path_only_scene_update_does_not_trigger_automatic_rename():\n    assert scene_hook_has_naming_changes({"path": "/tmp/renamed.m4v"}) is False\n\n\ndef test_actual_naming_metadata_edit_still_triggers_automatic_rename():\n    assert scene_hook_has_naming_changes({"title": "New title"}) is True\n    assert scene_hook_has_naming_changes({"studio_id": "12"}) is True\n    assert scene_hook_has_naming_changes({"performer_ids": ["1", "2"]}) is True\n''', encoding='utf-8')
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Syntax check
        run: python -m py_compile librarymanager.py librarymanager_monitor.py librarymanager_core.py

      - name: Focused regression tests
        run: python -m pytest -q tests/test_external_manual_rename.py tests/test_companion_safety.py

      - name: Full test suite
        run: python -m pytest -q

      - name: Commit tested fix
        shell: bash
        run: |
          if git diff --quiet -- librarymanager.py tests/test_external_manual_rename.py; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add librarymanager.py tests/test_external_manual_rename.py
          git commit -m "Preserve externally renamed filenames"
          git push origin HEAD:fix/companion-safety-v1.0.4

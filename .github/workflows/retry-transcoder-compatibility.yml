name: Retry transcoder replacement compatibility

on:
  push:
    branches:
      - fix/companion-safety-v1.0.4
    paths:
      - .github/workflows/retry-transcoder-compatibility.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/companion-safety-v1.0.4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse patch script with corrected opt-in check
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-transcoder-compatibility.yml').read_text()
          marker = '      - name: Apply patch\n        shell: python\n        run: |\n'
          start = workflow.index(marker) + len(marker)
          end = workflow.index('      - name: Install test dependencies\n', start)
          block = workflow[start:end]
          script = textwrap.dedent(block)
          script = script.replace(
              'getattr(self.worker, "transcoder_compatibility", False)\\n                    and Path(event.src_path)',
              'getattr(self.worker, "transcoder_compatibility", False) is True\\n                    and Path(event.src_path)'
          )
          exec(compile(script, '<transcoder-patch>', 'exec'))
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m py_compile librarymanager.py librarymanager_monitor.py librarymanager_core.py
      - name: Focused regression tests
        run: python -m pytest -q tests/test_transcoder_replacement.py tests/test_fileflows_compatibility.py tests/test_companion_safety.py tests/test_external_manual_rename.py
      - name: Full test suite
        run: python -m pytest -q
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add librarymanager.yml librarymanager.js librarymanager.py librarymanager_monitor.py tests/test_transcoder_replacement.py
          git commit -m "Add opt-in transcoder replacement compatibility"
          git push origin HEAD:fix/companion-safety-v1.0.4

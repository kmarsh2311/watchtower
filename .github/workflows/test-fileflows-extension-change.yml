name: Test FileFlows extension-change companions

on:
  push:
    branches:
      - fix/companion-safety-v1.0.4
    paths:
      - .github/workflows/test-fileflows-extension-change.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/companion-safety-v1.0.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Focused FileFlows compatibility test
        run: python -m pytest -q tests/test_fileflows_compatibility.py
      - name: Full test suite
        run: python -m pytest -q

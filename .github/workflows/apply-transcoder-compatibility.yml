name: Apply transcoder replacement compatibility

on:
  push:
    branches:
      - fix/companion-safety-v1.0.4
    paths:
      - .github/workflows/apply-transcoder-compatibility.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/companion-safety-v1.0.4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # Plugin setting declaration.
          replace('librarymanager.yml',
          '''  automaticMoveReconciliation:\n    displayName: Reconcile Verified External Moves\n    description: After an exact watched move passes size/hash checks, ask Stash to scan the destination and verify its path update.\n    type: BOOLEAN\n''',
          '''  automaticMoveReconciliation:\n    displayName: Reconcile Verified External Moves\n    description: After an exact watched move passes size/hash checks, ask Stash to scan the destination and verify its path update.\n    type: BOOLEAN\n  transcoderReplacementCompatibility:\n    displayName: Transcoder Replacement Compatibility\n    description: Opt in to reconnect likely same-folder transcoder replacements (for example movie.mp4 to movie encoded.mp4) even though their size/hash changed. Ambiguous replacements are never accepted.\n    type: BOOLEAN\n''')

          # UI defaults and switch in filesystem-monitor settings.
          replace('librarymanager.js',
          '''          automaticMoveReconciliation: false,\n          automaticIncomingScan: false,''',
          '''          automaticMoveReconciliation: false,\n          transcoderReplacementCompatibility: false,\n          automaticIncomingScan: false,''')
          replace('librarymanager.js',
          '''          React.createElement(Switch, { setting: "automaticMoveReconciliation", label: "Reconcile Verified External Moves",\n            help: "When a file is moved outside of Stash and verified by size/hash, ask Stash to scan the new path and reconnect it." }),\n''',
          '''          React.createElement(Switch, { setting: "automaticMoveReconciliation", label: "Reconcile Verified External Moves",\n            help: "When a file is moved outside of Stash and verified by size/hash, ask Stash to scan the new path and reconnect it." }),\n          React.createElement(Switch, { setting: "transcoderReplacementCompatibility", label: "Transcoder Replacement Compatibility",\n            help: "Optional compatibility for FileFlows, HandBrake, Tdarr and similar tools. Allows a strongly related same-folder replacement such as movie.mp4 → movie encoded.mp4 to reconnect even though its video fingerprint changed. Ambiguous matches are skipped." }),\n''')

          # Pass config into monitor startup and reload payloads.
          replace('librarymanager.py',
          '''        "automatic_move_reconciliation": config.get("automaticMoveReconciliation") is True,\n        "mac_notifications": config.get("macNotifications") is True,''',
          '''        "automatic_move_reconciliation": config.get("automaticMoveReconciliation") is True,\n        "transcoder_replacement_compatibility": config.get("transcoderReplacementCompatibility") is True,\n        "mac_notifications": config.get("macNotifications") is True,''', 2)

          # Monitor helper: only conservative same-directory filename relationships qualify.
          replace('librarymanager_monitor.py',
          '''def tracked_move(database_path, source, destination):\n    """Verify a move from the exact inventoried path without changing any record."""\n''',
          '''TRANSCODER_SUFFIXES = ("encoded", "transcoded", "h265", "hevc", "x265")\n\n\ndef _normalise_transcoder_stem(stem):\n    value = str(stem or "").strip().casefold()\n    for suffix in TRANSCODER_SUFFIXES:\n        for separator in (" ", "-", "_"):\n            token = separator + suffix\n            if value.endswith(token):\n                return value[:-len(token)].rstrip(" -_")\n    return value\n\n\ndef likely_transcoder_replacement(source, destination):\n    """Return True only for a conservative same-directory transcode-style replacement."""\n    src = Path(source)\n    dst = Path(destination)\n    try:\n        if src.parent.resolve() != dst.parent.resolve():\n            return False\n    except (OSError, ValueError):\n        return False\n    if src.suffix.lower() not in VIDEO_EXTENSIONS or dst.suffix.lower() not in VIDEO_EXTENSIONS:\n        return False\n    src_stem = src.stem.strip().casefold()\n    dst_stem = dst.stem.strip().casefold()\n    if not src_stem or not dst_stem:\n        return False\n    return src_stem == dst_stem or _normalise_transcoder_stem(dst_stem) == src_stem\n\n\ndef inventoried_source(database_path, source):\n    connection = connect(database_path)\n    try:\n        row = connection.execute("SELECT * FROM files WHERE path=?", (source,)).fetchone()\n        return dict(row) if row else None\n    finally:\n        connection.close()\n\n\ndef tracked_move(database_path, source, destination):\n    """Verify a move from the exact inventoried path without changing any record."""\n''')

          # Worker accepts opted-in likely transcodes but keeps strict mode as default.
          replace('librarymanager_monitor.py',
          '''class MoveWorker(threading.Thread):\n    def __init__(self, database_path, stash, enabled, notifications):\n        super().__init__(daemon=True)\n        self.database_path, self.stash = database_path, stash\n        self.enabled, self.notifications = enabled, notifications\n''',
          '''class MoveWorker(threading.Thread):\n    def __init__(self, database_path, stash, enabled, notifications, transcoder_compatibility=False):\n        super().__init__(daemon=True)\n        self.database_path, self.stash = database_path, stash\n        self.enabled, self.notifications = enabled, notifications\n        self.transcoder_compatibility = bool(transcoder_compatibility)\n''')
          replace('librarymanager_monitor.py',
          '''                row, reason = tracked_move(self.database_path, source, destination)\n                if not row:\n                    record_activity(self.database_path, "filesystem", "external move", "review",\n                                    severity="warning", old_path=source, new_path=destination, detail=reason)\n                    notify(self.notifications, f"File move needs review: {Path(destination).name}")\n                    continue\n                record_activity(self.database_path, "filesystem", "external move", "verified",\n                                scene_id=row["scene_id"], file_id=row["file_id"], old_path=source,\n                                new_path=destination, detail=reason)\n''',
          '''                row, reason = tracked_move(self.database_path, source, destination)\n                transcode_replacement = False\n                if not row and self.transcoder_compatibility and likely_transcoder_replacement(source, destination):\n                    row = inventoried_source(self.database_path, source)\n                    if row:\n                        transcode_replacement = True\n                        reason = "Likely same-folder transcoder replacement accepted by explicit compatibility setting"\n                if not row:\n                    record_activity(self.database_path, "filesystem", "external move", "review",\n                                    severity="warning", old_path=source, new_path=destination, detail=reason)\n                    notify(self.notifications, f"File move needs review: {Path(destination).name}")\n                    continue\n                record_activity(self.database_path, "filesystem",\n                                "transcoder replacement" if transcode_replacement else "external move",\n                                "accepted" if transcode_replacement else "verified",\n                                scene_id=row["scene_id"], file_id=row["file_id"], old_path=source,\n                                new_path=destination, detail=reason)\n''')

          # Track recent deleted videos so delete/create replacement workflows can be paired.
          replace('librarymanager_monitor.py',
          '''        self._recent_creates: dict[str, float] = {}\n        self._recent_creates_lock = threading.Lock()\n''',
          '''        self._recent_creates: dict[str, float] = {}\n        self._recent_deleted_videos: dict[str, float] = {}\n        self._recent_creates_lock = threading.Lock()\n''')
          replace('librarymanager_monitor.py',
          '''            with self._recent_creates_lock:\n                self._recent_creates[event.src_path] = time.monotonic()\n                # Prune entries older than 30 s to prevent unbounded growth\n                cutoff = time.monotonic() - 30.0\n                self._recent_creates = {k: v for k, v in self._recent_creates.items() if v > cutoff}\n            record_filesystem_event(self.database_path, "created", event.src_path, is_directory=event.is_directory, initial_status="pending")\n''',
          '''            with self._recent_creates_lock:\n                self._recent_creates[event.src_path] = time.monotonic()\n                # Prune entries older than 30 s to prevent unbounded growth\n                cutoff = time.monotonic() - 30.0\n                self._recent_creates = {k: v for k, v in self._recent_creates.items() if v > cutoff}\n                self._recent_deleted_videos = {k: v for k, v in self._recent_deleted_videos.items() if v > cutoff}\n                deleted_candidates = [old for old, seen in self._recent_deleted_videos.items()\n                                      if time.monotonic() - seen <= 30.0\n                                      and likely_transcoder_replacement(old, event.src_path)]\n            if (getattr(self.worker, "transcoder_compatibility", False)\n                    and Path(event.src_path).suffix.lower() in VIDEO_EXTENSIONS\n                    and len(deleted_candidates) == 1):\n                self.worker.submit(deleted_candidates[0], event.src_path)\n            record_filesystem_event(self.database_path, "created", event.src_path, is_directory=event.is_directory, initial_status="pending")\n''')
          replace('librarymanager_monitor.py',
          '''            if Path(event.src_path).suffix.lower() not in TEMPORARY_DOWNLOAD_EXTENSIONS:\n                record_filesystem_event(self.database_path, "deleted", event.src_path, is_directory=event.is_directory, initial_status="pending")\n''',
          '''            if Path(event.src_path).suffix.lower() not in TEMPORARY_DOWNLOAD_EXTENSIONS:\n                if Path(event.src_path).suffix.lower() in VIDEO_EXTENSIONS:\n                    with self._recent_creates_lock:\n                        self._recent_deleted_videos[event.src_path] = time.monotonic()\n                record_filesystem_event(self.database_path, "deleted", event.src_path, is_directory=event.is_directory, initial_status="pending")\n''')

          # Startup + live reload flag.
          replace('librarymanager_monitor.py',
          '''    worker = MoveWorker(database_path, stash, runtime.get("automatic_move_reconciliation") is True,\n                        runtime.get("mac_notifications") is True)\n''',
          '''    worker = MoveWorker(database_path, stash, runtime.get("automatic_move_reconciliation") is True,\n                        runtime.get("mac_notifications") is True,\n                        runtime.get("transcoder_replacement_compatibility") is True)\n''')
          replace('librarymanager_monitor.py',
          '''                            worker.enabled = bool(new_cfg.get("automatic_move_reconciliation", worker.enabled))\n                            worker.notifications = bool(new_cfg.get("mac_notifications", worker.notifications))\n''',
          '''                            worker.enabled = bool(new_cfg.get("automatic_move_reconciliation", worker.enabled))\n                            worker.transcoder_compatibility = bool(new_cfg.get("transcoder_replacement_compatibility", worker.transcoder_compatibility))\n                            worker.notifications = bool(new_cfg.get("mac_notifications", worker.notifications))\n''')

          # Permanent regression tests.
          p = Path('tests/test_transcoder_replacement.py')
          p.write_text('''import json\nimport tempfile\nimport time\nfrom pathlib import Path\nfrom unittest.mock import MagicMock, patch\n\nfrom librarymanager_core import connect, opensubtitles_hash\nfrom librarymanager_monitor import (LibraryEventHandler, MoveWorker, likely_transcoder_replacement)\n\n\ndef _insert(database, path):\n    con = connect(database)\n    try:\n        con.execute(\n            """INSERT INTO files(file_id,scene_id,path,basename,title,studio,performers_json,size,duration,\n                   fingerprints_json,scene_metadata_json,exists_on_disk,first_seen_at,last_seen_at,missing_since)\n               VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",\n            ('1', '10', str(path), path.name, 'Movie', None, '[]', path.stat().st_size, 10.0,\n             json.dumps([{'type': 'oshash', 'value': opensubtitles_hash(path)}]), '{}', 1,\n             '2026-01-01T00:00:00+00:00', '2026-01-01T00:00:00+00:00', None),\n        )\n        con.commit()\n    finally:\n        con.close()\n\n\ndef test_likely_transcoder_name_rules_are_conservative():\n    assert likely_transcoder_replacement('/a/movie.mp4', '/a/movie encoded.mp4')\n    assert likely_transcoder_replacement('/a/movie.mp4', '/a/movie-hevc.mkv')\n    assert likely_transcoder_replacement('/a/movie.mp4', '/a/movie.mkv')\n    assert not likely_transcoder_replacement('/a/movie.mp4', '/b/movie encoded.mp4')\n    assert not likely_transcoder_replacement('/a/movie.mp4', '/a/other encoded.mp4')\n    assert not likely_transcoder_replacement('/a/movie.mp4', '/a/movie final.mp4')\n\n\ndef test_strict_mode_rejects_changed_content_but_opt_in_accepts_candidate():\n    with tempfile.TemporaryDirectory() as td:\n        root = Path(td)\n        db = root / 'db.sqlite3'\n        old = root / 'movie.mp4'\n        new = root / 'movie encoded.mp4'\n        old.write_bytes(b'A' * 200000)\n        _insert(db, old)\n        new.write_bytes(b'B' * 100000)\n        stash = MagicMock()\n        strict = MoveWorker(db, stash, True, False, False)\n        compat = MoveWorker(db, stash, True, False, True)\n        assert strict.transcoder_compatibility is False\n        assert compat.transcoder_compatibility is True\n\n\ndef test_delete_create_pair_is_submitted_only_when_opted_in_and_unambiguous():\n    with tempfile.TemporaryDirectory() as td:\n        root = Path(td)\n        db = root / 'db.sqlite3'\n        old = root / 'movie.mp4'\n        old.write_bytes(b'A' * 200000)\n        _insert(db, old)\n        old.unlink()\n        new = root / 'movie encoded.mp4'\n        new.write_bytes(b'new encoded bytes')\n        worker = MagicMock()\n        worker.transcoder_compatibility = True\n        handler = LibraryEventHandler(db, worker, False, incoming_worker=None)\n        handler._recent_deleted_videos[str(old)] = time.monotonic()\n        event = MagicMock(is_directory=False, src_path=str(new))\n        handler.on_created(event)\n        worker.submit.assert_called_once_with(str(old), str(new))\n\n        worker.reset_mock()\n        worker.transcoder_compatibility = False\n        handler.on_created(event)\n        worker.submit.assert_not_called()\n\ndef test_ambiguous_recent_deletes_do_not_auto_pair():\n    with tempfile.TemporaryDirectory() as td:\n        root = Path(td)\n        db = root / 'db.sqlite3'\n        new = root / 'movie encoded.mp4'\n        new.write_bytes(b'new')\n        worker = MagicMock()\n        worker.transcoder_compatibility = True\n        handler = LibraryEventHandler(db, worker, False, incoming_worker=None)\n        now = time.monotonic()\n        handler._recent_deleted_videos[str(root / 'movie.mp4')] = now\n        handler._recent_deleted_videos[str(root / 'movie.mkv')] = now\n        event = MagicMock(is_directory=False, src_path=str(new))\n        handler.on_created(event)\n        worker.submit.assert_not_called()\n''')
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m py_compile librarymanager.py librarymanager_monitor.py librarymanager_core.py
      - name: Focused regression tests
        run: python -m pytest -q tests/test_transcoder_replacement.py tests/test_fileflows_compatibility.py tests/test_companion_safety.py tests/test_external_manual_rename.py
      - name: Full test suite
        run: python -m pytest -q
      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add librarymanager.yml librarymanager.js librarymanager.py librarymanager_monitor.py tests/test_transcoder_replacement.py
          git commit -m "Add opt-in transcoder replacement compatibility"
          git push origin HEAD:fix/companion-safety-v1.0.4
